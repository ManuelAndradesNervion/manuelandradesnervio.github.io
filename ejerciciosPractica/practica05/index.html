<!DOCTYPE html>
<html>

<head>
    <title> Ejemplo de tablas </title>
    <meta charset="UTF-8">
</head>

<body>
    <table border="1">
        <thead>
            <tr>
                <th>Lunes</th>
                <th>Martes</th>
                <th>Miércoles</th>
                <th>Jueves</th>
                <th>Viernes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mates</td>
                <td rowspan="3" colspan="3">Dibujo</td>
                <td rowspan="3">Historia</td>
            </tr>
            <tr>
                <td rowspan="3">Física</td>
            </tr>
            <tr>
                <td>Lengua</td>
                <td>Inglés</td>
                <td>Francés</td>
            </tr>
            <tr>
                <td>EF</td>
                <td>Fútbol</td>
                <td>Tenis</td>
                <td>Mates</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
